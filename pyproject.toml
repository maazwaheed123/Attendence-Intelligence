[project]
name = "attendance-intelligence"
version = "0.1.0"
description = "Enterprise RAG Attendance Intelligence Microservice (MVP)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = [
    "S101",  # assert is fine in tests
    "B008",  # FastAPI Depends() in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501", "SIM117"]  # long SQL literals; pytest.raises + session nesting
"scripts/**" = ["S311"]  # non-crypto RNG is intended for synthetic data

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "unit: pure-function tests",
    "integration: needs Postgres/Redis",
    "security: isolation, auth, injection, PII, abuse tests",
    "ocr: OCR accuracy tests (slower)",
    "e2e: full API flows",
    "live: real local Ollama models; excluded from the gate",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*"]
